# ─────────────────────────────────────────────────────────────────────────────
# 1. IDENTITY
# ─────────────────────────────────────────────────────────────────────────────

title: "Junyu Chen | Economics"
first_name: Junyu
last_name: Chen
email: junyu.chen at rug.nl

url: https://junyuchen-econ.github.io
baseurl:

description: >
  PhD candidate in Economics at the University of Groningen.
  Research: financial econometrics, machine learning.

footer_text: >

icon: JC

keywords: economics, financial econometrics, machine learning, research, Groningen, Netherlands, 经济学, 金融计量经济学, 机器学习, 格罗宁根, 荷兰

lang: en


# ─────────────────────────────────────────────────────────────────────────────
# 2. LAYOUT & FEATURES
# ─────────────────────────────────────────────────────────────────────────────

navbar_fixed: true
footer_fixed: true
max_width: 930px

enable_navbar_social: false
enable_darkmode: false
enable_math: true
enable_medium_zoom: true
enable_progressbar: true
enable_masonry: false
enable_project_categories: false
enable_tooltips: false
enable_video_embedding: false
enable_cookie_consent: false

back_to_top: true
last_updated: true
lazy_loading_images: true

search_enabled: false

serve_og_meta: true
serve_schema_org: true
og_image:

permalink: /blog/:year/:title/
lsi: false

pagination:
  enabled: false


# ─────────────────────────────────────────────────────────────────────────────
# 3. JEKYLL INTERNALS
# ─────────────────────────────────────────────────────────────────────────────

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

include: ["_pages"]
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
keep_files:
  - CNAME
  - .nojekyll

theme: al_folio_core

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false
  - scope:
      path: "google*.html"
    values:
      sitemap: false

sass:
  style: compressed

plugins:
  - jekyll-3rd-party-libraries
  - jekyll-cache-bust
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-imagemagick
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-regex-replace
  - jekyll-sitemap
  - jekyll-socials
  - jekyll-terser
  - jemoji
  - al_folio_core
  - al_icons
  - al_folio_upgrade
  - al_folio_bootstrap_compat
  - al_analytics
  - al_img_tools
  - al_math

jekyll-minifier:
  compress_javascript: false
  compress_css: false
  exclude: ["robots.txt"]

terser:
  compress:
    drop_console: true

external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:


# ─────────────────────────────────────────────────────────────────────────────
# 4. al-folio API & THIRD-PARTY LIBRARY VERSIONS  (do not edit)
# ─────────────────────────────────────────────────────────────────────────────

al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  distill:
